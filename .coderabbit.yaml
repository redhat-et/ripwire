# CodeRabbit review settings for ripwire. Schema: https://coderabbit.ai/integrations/schema.v2.json
#
# Why this file exists: one review pass when a PR opens, not a loop.
#   - The review on open stays; it is the one that finds real defects.
#   - No re-review on every push: each fix commit used to start a new pass over a new diff.
#   - No automatic reply inside review threads: every in-thread answer used to wake another pass.
#   - Vendored parsers and generated/pinned files are excluded; a review of them cannot change them.
# CodeRabbit reads this file from the PR's head branch, so a fork PR picks it up once it merges main.
reviews:
  profile: chill                     # the default; "quiet" is the lever if noise persists
  auto_review:
    enabled: true                    # the review on open is the valuable one; keep it
    auto_incremental_review: false   # no re-review per push
  path_filters:
    - "!third_party/**"              # 98K-line vendored parsers (#233)
    - "!docs/captures/**"
    - "!test/*.hash"
    - "!test/printf_parity.manifest"
  path_instructions:
    - path: "src/**"
      instructions: >-
        Platforms: Unix/Linux/macOS first; native Windows second (clang-cl primary, MSVC cl.exe must also build).
        Flag cl.exe portability, but not as a blocker for a POSIX-only code path. Never suggest std::map/unordered_map.
        Determinism is a contract: output must never depend on crawl, path or thread order, and no float-equality
        ties; a tie breaks on canonical content keys or exact integer arithmetic.
        Pins and gate counts are re-derived by their generators, never hand-edited. Gates take the binary as $1.
        ASSUME/EXPECTS/ENSURES are free invariants: flag only side effects, external input, ASSUME(false).
        External input (files, git, env, argv, MCP/JSON, data read back from a cache) is checked with VALIDATE.
        A degrade path uses DISCLOSE( sink, why ), never ASSUME(false): a one-argument DISCLOSE( msg ) is a debug trace
        that ships nothing, and a Diagnostics::answerUnchanged reason must be true. A count that cannot be a total must be
        labelled a floor; a zero means none found. Flag silent zeros, undisclosed truncation, and gate arms
        that cannot fail.
  sequence_diagrams: false
chat:
  auto_reply: false                  # thread replies no longer wake it
