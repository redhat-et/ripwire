        "query": "json:parse_bjdata_fuzzer reaches assertion ### Description The input `0x5b, 0x24, 0x5b` triggers an assertion in the fuzzer for BJData. - https://bugs.chromium.org/p/oss-fuzz/issues/detail?id=47145 - https://oss-fuzz.com/testcase-detail/5643490366717952 ### Reproduction steps - Call the fuzzer on input `0x5b, 0x24, 0x5b`. - Observe the assertion. ### Expected vs. actual results No assertion should be triggered. Either the fuzzer must be made more robust against or there is a bug in the library that must be fixed. ### Minimal code example Adapted fuzzer: ```cpp #include <nlohmann/json.hpp> using json = nlohmann::json; int main() { std::vector<std::uint8_t> vec1 = {{0x5b, 0x24, 0x5b}}; json j1 = json::from_bjdata(vec1); try { // step 2.1: round trip without adding size annotations to container types std::vector<uint8_t> vec2 = json::to_bjdata(j1, false, false); // step 2.2: round trip with adding size annotations but without adding type annonations to container types std::vector<uint8_t> vec3 = json::to_bjdata(j1, true, false); // step 2.3: round trip with adding size as well as type annotations to container types std::vector<uint8_t> vec4 = json::to_bjdata(j1, true, true); // parse serialization json j2 = json::from_bjdata(vec2); json j3 = json::from_bjdata(vec3); json j4 = json::from_bjdata(vec4); // serializations must match assert(json::to_bjdata(j2, false, false) == vec2); assert(json::to_bjdata(j3, true, false) == vec3); assert(json::to_bjdata(j4, true, true) == vec4); } catch (const json::parse_error&) { // parsing a BJData serialization must not fail assert(false); } } ``` ### Error messages Assertion ```cpp // parsing a BJData serialization must not fail assert(false); ``` is triggered. In the original context, the following stack trace is produced: ``` +----------------------------------------Release Build Stacktrace----------------------------------------+ Command: /mnt/scratch0/clusterfuzz/resources/platform/linux/unshare -c -n /mnt/scrat