        "base_sha": "d4ac1b51d0aeb2d4f792136fe7792de709006afa",
        "query": "simdjson does not check that the value after high surrogate is in the range of a low surrogate? **Describe the bug** simdjon's dom parser (and other parsers) will accept the string `\"\\uD888\\u1234\"`, despite `\"\\u1234\"` not being a low surrogate (for surrogate pairs) in the range `U+DC00\u2014U+DFFF` This was an example found in the json minefield test suite also mentioned elsewhere in the simdjson issue tracker for surrogate pair bug fixes https://github.com/TkTech/pysimdjson/blob/master/jsonexamples/test_parsing/i_string_1st_valid_surrogate_2nd_invalid.json https://seriot.ch/projects/parsing_json.html (i_ is implementation-defined) Related to issue https://github.com/simdjson/simdjson/issues/1870 Related to https://unicodebook.readthedocs.io/unicode_encodings.html#utf-16-surrogate-pairs ``` U+D800\u2014U+DBFF (1,024 code points): high surrogates U+DC00\u2014U+DFFF (1,024 code points): low surrogates ``` ```c // simdjson/src/generic/stage2/stringparsing.h simdjson_inline bool handle_unicode_codepoint(const uint8_t **src_ptr, uint8_t **dst_ptr) { // jsoncharutils::hex_to_u32_nocheck fills high 16 bits of the return value with 1s if the // conversion isn't valid; we defer the check for this to inside the // multilingual plane check uint32_t code_point = jsoncharutils::hex_to_u32_nocheck(*src_ptr + 2); *src_ptr += 6; // If we found a high surrogate, we must // check for low surrogate for characters // outside the Basic // Multilingual Plane. if (code_point >= 0xd800 && code_point < 0xdc00) { if (((*src_ptr)[0] != '\\\\') || (*src_ptr)[1] != 'u') { return false; } uint32_t code_point_2 = jsoncharutils::hex_to_u32_nocheck(*src_ptr + 2); // if the first code point is invalid we will get here, as we will go past // the check for being outside the Basic Multilingual plane. If we don't // find a \\u immediately afterwards we fail out anyhow, but if we do, // this check catches both the case of the first code point being invalid // or the second code point being invalid. if ((code_point | code_point_2) >> 16) { return false; } code_point = (((code_point - 0xd800) << 10) | (code_point_2 - 0xdc00)) + 0x10000; *src_ptr += 6; } else if (code_point >= 0xdc00 && code_point <= 0xdfff) { // If we encounter a low surrogate (not preceded by a high surrogate) // then we have an error. return false; } ``` Looking at the method: 1. `if ((code_point | code_point_2) >> 16) {` seems to be in the wrong position. ` if (code_point >= 0xd800 && code_point < 0xdc00) {` implies that `(code_point >> 16) === 0` do there doesn't seem to be an effect of the bitwise or. But even if that's meant to be the code_point after the reassignment, `0x10FFFF >> 16` would still be true, so that also seems wrong. 2. Maybe the check should be `if ((code_point_2 - 0xdc00) >> 16)` so it would fail both for invalid hex (all high 16 bits set) and for values smaller than 0xdc00? 3. the check can still overflow - i.e. it isn't checking for `code_point_2 <= 0xdfff` - i.e. it should reject `\\xD888\\xE0000`? 4. Maybe it's meant to check `if (((code_point - 0xd800) | (code_point_2 - 0xdc00)) >> 10) { return false; }` - though I don't know if that'd even be more efficient (e.g. check that they're both in the range of 1024 possible values, fail if at least one isn't) EDIT: This already checked `code_point >= 0xd800 && code_point < 0xdc00`, so only code_point_2 would need to be checked at that point for `if ((code_point_2 - 0xdc00) >> 10) { return false; }` E.g. if you execute that step by step 1. code_point = 0xd888 = 55432 2. code_point_2 = 0x1234 = 4660 3. code_point is reassigned to `(((code_point - 0xd800) << 10) | (code_point_2 - 0xdc00)) + 0x10000;` and becomes 13876 (which is between 0...0x10FFFF) and the function succeeds with an invalid low surrogate **To Reproduce** Call simdjson handle_unicode_codepoint with `\\uD888\\u1234` or simdjson decode in a binding with `\"\\uD888\\u1234\"` (testing with dom bindings) Observed: simdjson decodes `\"\\uD888\\u1234\"` as `\u3634`, reencoded as `\"\\\\u3634\"` Expected: simdjson should throw for the following codepoint being out of the range of a low surrogate If we cannot reproduce the issue, then we cannot address it. Note that a stack trace from your own program is not enough. A sample of your source code is insufficient: please provide a complete test for us to reproduce the issue. Please reduce the issue: use as small and as simple an example of the bug as possible. It should be possible to trigger the bug by using solely simdjson with our default build setup. If you can only observe the bug within some specific context, with some other software, please reduce the issue first. **simjson release** https://github.com/simdjson/simdjson/tree/v2.2.2/singleheader **Indicate whether you are willing or able to provide a bug fix as a pull request** If you plan to contribute to simdjson, please read our * CONTRIBUTING guide: https://github.com/simdjson/simdjson/blob/master/CONTRIBUTING.md and our * HACKING guide: https://github.com/simdjson/simdjson/blob/master/HACKING.md",
