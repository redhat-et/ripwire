        "query": "Possible confusion between key access and jsonpointer Current if I have an object element and I use the [] operator on it, I would exact to call the \"at_key\" method and indeed it is documented as such... ``` /** * Get the value associated with the given key. * * The key will be matched against **unescaped** JSON: * * document::parser parser; * parser.parse(R\"({ \"a\\n\": 1 })\")[\"a\\n\"].as_uint64_t().value == 1 * parser.parse(R\"({ \"a\\n\": 1 })\")[\"a\\\\n\"].as_uint64_t().error == NO_SUCH_FIELD * * @return The value associated with this field, or: * - NO_SUCH_FIELD if the field does not exist in the object */ inline element_result at_key(std::string_view s) const noexcept; ``` Unfortunately, I do not think that's what it does. Instead it appears to be doing a jpointer query. I think that this explains the poor performance I got out of the API. To get around it, I implemented that \"at_key\" method myself. I don't know how to fix this, but it should be at least documented carefully.",
