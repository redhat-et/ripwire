        "base_sha": "0b21203141bd31229c77e4b1e8b22f523a4a69e0",
        "query": "Make simdjson.h the only way to #include simdjson It seems like we presently offer two ways to consume simdjson: single header and multiple header. The apis are identical, but you have to include different headers depending which one you use. This means that documentation is going to be confusing: any documentation or tutorials needs to tell you what to include, so docs either have to be written twice, or written once with a caveat. It also presents users with an arguably valueless choice at the very beginning of their experience with simdjson. I suggest we: 1. Make a new include/simdjson.h that includes everything the amalgamated files do. 2. Use #include \"simdjson.h\" in all tests, documentation and sample files. It won't be using the actual amalgamated headers, but it will be consistent with docs. Don't give users wrong examples to copy/paste :) 3. This might be a good time to rename it simdjson.hpp. That seems like the standard for C++ libraries ... 4. Make all documentation talk about consuming the single header version. Or at least, make include/simdjson.cpp that includes all the .cpp files so that the two methods are identical from within a user's .cpp file. I considered three alternatives here, but rejected them for various reasons: * Make tests depend on the amalgamated simdjson.h. This would be great for test coverage, and we could make it work with straightforward make rules. But would absolutely suck for us while debugging because when we have compile or valgrind issues, it wouldn't point us at the files we actually need to fix. (Now that I say it out loud, perhaps inserting #file directives would solve that problem ... this could be pretty attractive, then, but I'm not sure what IDEs would do.) * Remove simdjson/*.h and actually put everything in the amalgamated header. I rejected this for now because it seemed like it would suck to develop. It would be attractive, though, because there would be no difference between what users use and what we use. I am open, and even eager, to be convinced otherwise :) * Make src/ depend on simdjson.h. This would increase compile times for us while developing. The main reason to include simdjson.h internally is to make sure users get the right idea when they look at example files, and I don't think they will copy paste their includes from our src/ files.",
