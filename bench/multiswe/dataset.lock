        "query": "Parse `\"-1e-999\"` and `\"-0e-999\"` as -0.0 instead of 0.0 in dom api(signed zero)? **Is your feature request related to a problem? Please describe.** Currently, simdjson parses `\"-1e-999\"` and `\"-0e-999\"` as `0.0`, not as `-0.0` This is inconsistent with the way simdjson parses `\"-0.0\"` as `-0.0` #1532 is a different issue, but support for negative zero (signed zero) seems to be intended in this project (This would matter when stringifying results, or when dividing by the numbers returned by the library) **Describe the solution you'd like** Return negative zero in `write_float` in include/simdjson/generic/numberparsing.h if there is a leading minus sign ```patch @@ simdjson_inline error_code write_float(const uint8_t *const src, bool negative, static_assert(simdjson::internal::smallest_power <= -342, \"smallest_power is not small enough\"); // if((exponent < simdjson::internal::smallest_power) || (i == 0)) { - WRITE_DOUBLE(0, src, writer); + WRITE_DOUBLE(negative ? -0.0 : 0.0, src, writer); ``` Other json implementations I've seen, such as python json.loads and php json_decode(), return negative zero ```python >>> import math >>> import json >>> json.loads(\"-1.0e-999\") -0.0 >>> json.loads(\"-0.0e-999\") -0.0 >>> json.loads(\"-0e-999\") -0.0 >>> json.loads(\"0.0e-999\") 0.0 >>> json.loads(\"0.0\") 0.0 ``` **Additional context** Noticed while working on php simdjson bindings ** Are you willing to contribute code or documentation toward this new feature? ** yes",
