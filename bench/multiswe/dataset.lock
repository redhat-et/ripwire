        "query": "Allow compilation with -fno-exceptions We have written simdjson to work idiomatically in environments both with and without exceptions. But that means there is some exception-throwing code in there. If I'm reading the gcc docs right, we need to add `#if __cpp_exceptions` around `invalid_json` and around those few methods that throw. Note: we comment them out, not make alternative versions of them. Throws in simdjson are limited to cast operators; the user casts to the desired valid object, and it throws if there was an error. If we make a non-throwing version, it'd be super easy to accidentally write an unsafe program that ignores errors, and that's not the intent.",
