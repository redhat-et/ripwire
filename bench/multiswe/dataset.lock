        "query": "Support << for parsed JSON DOM We should print JSON when you `<<` a simdjson DOM element or document: ```c++ // Print document document doc = document::parse(R\"( { \"a\": [1,2,3], \"b\": \"xyz\" } )\"); cout << doc; // => {\"a\":[1,2,3],\"b\":\"xyz\"} // Print element cout << doc[\"a\"] << endl; // => [1,2,3] cout << doc[\"b\"] << endl; // => \"xyz\" (including quotes) // Straight shot print with exception cout << document::parse(\"[1,2,3]\"); // => [1,2,3] ``` These would print minified JSON by default. Stretch goal would be prettification with faux I/O manipulators like `cout << prettify(doc[\"a\"])` or maybe `cout << doc[\"a\"].prettify()`, but that could be tracked by a separate issue if it turns out to be too hard. This should replace and deprecate `print_json()`.",
