        "query": "Printed seconds precision does not match C++20 spec According to https://eel.is/c++draft/time.format#tab:time.format.spec, under the `%S` specifier: > If the precision of the input cannot be exactly represented with seconds, then the format is a decimal floating-point number with a fixed format and a precision matching that of the precision of the input (or to a microseconds precision if the conversion to floating-point decimal seconds cannot be made within 18 fractional digits). When outputting a `std::chrono::system_clock::time_point` (with resolution in nanoseconds) via the `%S` format specifier, fmt currently only prints the whole seconds, and does not add the decimal fraction according to the C++20 spec. Godbolt demo: https://godbolt.org/z/h4rfo5zTr It outputs `01`, where it should be `01.234000000` according to the spec. Using [hinnant/date](https://github.com/HowardHinnant/date), I get the expected result: ```c++ using time_type = typename std::chrono::system_clock::time_point; time_type t{std::chrono::milliseconds{1234}}; auto s = date::format(std::locale::classic(), \"%S\", t); fmt::print(\"{}\\n\", s); // prints 01.234000000 ``` If one wants to print whole seconds with a `system_clock::time_point`, they first have to [floor](https://en.cppreference.com/w/cpp/chrono/time_point/floor) it to a `sys_time<std::chrono::seconds>`. This problem also affects the `%T` specifier.",
