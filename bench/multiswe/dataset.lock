        "base_sha": "1b9a9d1f2122e73b69f5d62d0ce3ebda8cd41ff0",
        "query": "Invalid union access for get_ref/get_ptr with unsigned integer ### Description When a JSON value is stored as unsigned integer, it is possible to call `get_ref<number_integer_t>()` or `get_ptr<number_integer_t>()` without error, which accesses the *signed* integer member of the internal union instead of the *unsigned* member. This is undefined behaviour in C++ standard and should not be allowed (especially since trying access with other more clearly incompatible types, such as strings, is already checked and reported as an error). I note that a corresponding unit test exists but has been commented out: https://github.com/nlohmann/json/blob/63258397761b3dd96dd171e5a5ad5aa915834c35/tests/src/unit-reference_access.cpp#L218-L219 The root of the problem is that `is_number_integer()` returns `true` for both signed and unsigned integer storage, yet is used to guard reference/pointer access using signed integers: https://github.com/nlohmann/json/blob/63258397761b3dd96dd171e5a5ad5aa915834c35/include/nlohmann/json.hpp#L1464-L1467 I also note [the docs](https://json.nlohmann.me/api/basic_json/get_ref/#notes) say that \"Writing data to the referee of the result yields an undefined state.\", which isn't very clear. Does this mean we are not supposed to write a value to the object pointed to by the reference/pointer? The earlier wording (changed in https://github.com/nlohmann/json/commit/4e52277b70999ccf8858c7995dd72808a7e82c33#diff-b56a00981d8f3b87e3ce49a7eb27d36f4586d9c54c3fb628a88cfc000aa5fed4L2632) was \"The pointer becomes invalid if the underlying JSON object changes.\", which made more sense. ### Reproduction steps See code example below. ### Expected vs. actual results Expected: type error exception. Actual: no error, unsigned data is access as signed data (undefined behaviour). ### Minimal code example ```c++ #include <nlohmann/json.hpp> #include <iostream> int main() { using namespace nlohmann; json j = json::number_unsigned_t{1u}; assert(j.is_number_unsigned()); j.get_ref<json::number_integer_t&>() = -1; assert(j.is_number_unsigned()); std::cout << j.get<json::number_unsigned_t>() << std::endl; return 0; } ``` ### Error messages ```Shell None. ``` ### Compiler and operating system Linux x64, gcc 11 ### Library version 3.11.3 ### Validation - [X] The bug also occurs if the latest version from the [`develop`](https://github.com/nlohmann/json/tree/develop) branch is used. - [X] I can successfully [compile and run the unit tests](https://github.com/nlohmann/json#execute-unit-tests).",
        "subject": "Invalid union access for get_ref/get_ptr with unsigned integer",
        "gold_files_all": [
          "docs/mkdocs/docs/api/basic_json/get_ptr.md",
          "docs/mkdocs/docs/api/basic_json/get_ref.md",
          "include/nlohmann/json.hpp",
