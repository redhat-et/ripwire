        "base_sha": "35158257c6e79d908723f1a7023362a718579c4f",
        "query": "Provide an 'location of error' diagnostic when encountering errors in On Demand In On Demand, when an error is thrown, we still have the `json_iterator` instance (owned by the document instance) which contains a pointer to the location in the document. Thus we could ask the document for its location. After checking that the location is valid (not outside the bounds). This could help users identify the source of the JSON problem and improve usability. This is especially important for long documents. Relevant lines... https://github.com/simdjson/simdjson/blob/06643fc9f5f1019c49dc4564cf56a8c47010ad15/include/simdjson/generic/ondemand/json_iterator-inl.h#L184-L192 https://github.com/simdjson/simdjson/blob/06643fc9f5f1019c49dc4564cf56a8c47010ad15/include/simdjson/generic/ondemand/document-inl.h#L19-L21 I am not exactly sure of the right API, but something like this could do... ``` const char * pointer = document.current_location(); ``` This could be used more generally by users who need a low-level function that points at the current location in the JSON input. We could squeeze this into simdjson 1.0 if it is easy enough. This could be added to the document_reference instances so that our JSON streams also support this functionality. It is related to issue https://github.com/simdjson/simdjson/issues/237 See also https://github.com/simdjson/simdjson/issues/1657",
