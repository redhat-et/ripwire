        "base_sha": "9294e25c98f9c09a1874842dbcaae7a91336a57e",
        "query": "Soften the landing when dumping non-UTF8 strings (type_error.316 exception) When dumping a json object that contains an std:string we could be thrown the type_error.316 exception if the string contains invalid UTF8 sequences. While this sounds like a reasonable thing to do, it actually causes more problems than it fixes. In all the cases where user-entered (unsafe) strings end up stored in nlohmann::json objects the developer now has to \"do something\" before assigning a string value to some nlohmann::json variable. This effectively renders the whole string assignment functionality unsafe and defeats its purpose. Below is the wrapper code I had to write in order to investigate the random crashes my application went through due to the 316 exception. ```C++ // Declaration: std::string dump_json(const nlohmann::json &json, const int indent =-1, const char* file = __builtin_FILE(), int line = __builtin_LINE()) const; // Definition std::string MANAGER::dump_json(const nlohmann::json &json, const int indent, const char* file, int line) const { std::string result; try { result = json.dump(indent); } catch (nlohmann::json::type_error& e) { bug(\"%s: %s (%s:%d)\", __FUNCTION__, e.what(), file, line); } return result; } ``` This led me to the discovery of the code in my application that was sending json formatted log events to the log server. The log event has to store user entered data and I would expect the dump function to deal with invalid UTF8 sequences. If I have to use my json dump wrapper **everywhere** in my application code then of what use is the original dump function to begin with? What is more, I'd actually have to enhance the wrapper function to iterate over all strings stored in the json object and do _something_ about the possible invalid UTF8 sequences. Not very convenient. Therefore, I would propose the default behavior of the `dump` function to simply ignore (skip or replace) invalid UTF8 sequences and NOT throw. Or perhaps [add a nothrow parameter](http://www.cplusplus.com/reference/new/nothrow/) to the string assignment `=` operator. If left like that, I probably won't be the last developer who assumed that the dump method is safe to use. After all, if the lib allows me to assign a value to the json object then how can it be that it lets me assign values that later invalidate the whole json? This is illogical. ```C++ // nothrow assignment would look like this nlohmann::json j_nothrow = (std::nothrow) \"\\xF0\\xA4\\xAD\\xC0\"; // Does not throw. // I am not 100% sure if this can be done, but since the `new` operator can have such // a parameter I would suppose the assignment operator = could also be customized // like that. std::string dumped = j_nothrow.dump(); // Never throws, just works. nlohmann::json j_throw; try { j_throw = \"\\xF0\\xA4\\xAD\\xC0\"; // Throws immediately. } catch (nlohmann::json::type_error& e) { // handle the invalid UTF8 string } ``` One more thing. Why not include the file and line from where the exception originated in the exception description? You can see in my above wrapper function how I am using `__builtin_LINE()` and `__builtin_FILE()` to store the file and line information from where the wrapper call was made. It is super useful when debugging and exception description is all about debugging.",
