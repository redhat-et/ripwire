        "query": "Pretty print for DOM **Is your feature request related to a problem? Please describe.** There is no way to pretty print a `simdjson::dom::element` to a string (or at least I did not find one). There is only a way to minify it to a string (or a stream). **Describe the solution you'd like** A function like `to_pretty_string()` or a configurable stream manipulator `pretty` or a stand-alone class `PrettyPrinter`. Whatever fits. Pretty-printing json is a very common task used in various places. Basically, whenever a human needs to take a look on the stored json, it is better to display it with proper structure and indentation. **Describe alternatives you've considered** Using minified version is ok in some cases, but sometimes you really want a pretty verion. I see no other way than writing my own formatter. ** Are you willing to contribute code or documentation toward this new feature? ** Probably, but not sure. Nothing to contribute as of yet.",
