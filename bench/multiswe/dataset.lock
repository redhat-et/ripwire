        "query": "Custom type registration : instrusive API Currently, the API for registering custom types is as follows: ```cpp using nlohmann::json; namespace ns { void to_json(json& j, const person& p) { j = json{{\"name\", p.name}, {\"address\", p.address}, {\"age\", p.age}}; } void from_json(const json& j, person& p) { j.at(\"name\").get_to(p.name); j.at(\"address\").get_to(p.address); j.at(\"age\").get_to(p.age); } ``` It would be great if there was a MACRO-style registration a bit like what msgpack-c uses: ```cpp struct person { std::string name; std::string address; int age; MSGPACK_DEFINE_MAP(name, address, age); }; ``` or yas: ```cpp struct person { std::string name; std::string address; int age; YAS_DEFINE_STRUCT_SERIALIZE(\"person\", name, address, age); }; ``` or ```cpp struct person { std::string name; std::string address; int age; }; YAS_DEFINE_INTRUSIVE_SERIALIZE(\"person\", name, address, age); ```",
