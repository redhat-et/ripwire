        "query": "More discoverable API to parse a file Parsing a file is a very common operation, and even more common in the context of tutorials and samples, so getting the API clean and discoverable is important. 1. It needs to be a part of the parser API, so it's at my fingertips if I'm using IDE autocompletion or exploring the docs. 2. It should use words I would normally think of when I want to parse a file. (Probably not corpus.) ## Current Right now you have to type: ```c++ parser.parse(get_corpus(filename)); ``` ## Proposed We'd add a load() method: ```c++ parser.load(filename) ``` I also suggest we deprecate `get_corpus` as part of the public API, to prevent multiple-ways-to-do-the-same-job cognitive load.",
