        "query": "enum to json mapping One use-case I run into a lot is mapping enums to serialize as non-integers such as strings. I know its not really modern C++ to use preprocessor macros, but I wrote one that declares a from_json()/to_json() specialization in one statement to make it easier and less redundant to specialize the mapping between a given set of enum values and a set of json values. Motivating example: ```cpp // enum type declaration enum TaskState { TS_STOPPED, TS_RUNNING, TS_COMPLETED, TS_INVALID=-1, }; JSON_SERIALIZE_ENUM( TaskState, { {TS_INVALID, nullptr}, {TS_STOPPED, \"stopped\"}, {TS_RUNNING, \"running\"}, {TS_COMPLETED, \"completed\"}, }); // Usage: // enum -> json string nlohmann::json j = TS_STOPPED; assert(j == \"stopped\"); // json string-> enum nlohmann::json j3 = \"running\"; assert( j3.get<TaskState>() == TS_RUNNING); // unmapped json -> enum (default value is first pair) nlohmann::json jPi = 3.14; assert( jPi.get<TaskState>() == TS_INVALID ); ``` The JSON_SERIALIZE_ENUM() macro above is implemented as: ```cpp #define JSON_SERIALIZE_ENUM( ENUM_TYPE, ...)\\ inline void to_json( nlohmann::json& j, const ENUM_TYPE& e){\\ static const nlohmann::multi_bimap<ENUM_TYPE,nlohmann::json> m=__VA_ARGS__;\\ j = m.at_right(e);\\ } \\ inline void from_json( const nlohmann::json& j, ENUM_TYPE& e){\\ static const nlohmann::multi_bimap<ENUM_TYPE,nlohmann::json> m=__VA_ARGS__;\\ e = m.at_left(j);\\ } ``` This example is still just a sketch since it does not take into account that basic_json can be specialized for different types. One benefit of the multi_bimap<> is that it allows multiple enum values to map to the same JSON value and multiple JSON values to map to the same enum. The first matching pair found in at_right()/at_left is returned. I can provide you with implementation details for the multi_bimap<TL,TR> class but it is mostly just a simple wrapper around a vector<pair<TL,TR>> that is linear searched in at_right()/at_left(). When a key is not found in at_right() or at_left(), the first pair is used as default values.",
