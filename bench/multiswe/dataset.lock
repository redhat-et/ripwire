        "query": "CBOR parser doesn't skip tags Using 456478b3c50d60100dbb1fb9bc931f370a2c1c28 (3.7.3) The following code should parse a CBOR value: ``` #include \"json.hpp\" #include <sstream> class NullSAXParser : public nlohmann::json_sax<nlohmann::json> { public: bool null() override { return true; } bool boolean(bool val) override { return true; } bool number_integer(number_integer_t val) override { return true; } bool number_unsigned(number_unsigned_t val) override { return true; } bool number_float(number_float_t val, const string_t &s) override { return true; } bool string(string_t &val) override { return true; } bool start_object(std::size_t elements) override { return true; } bool key(string_t &val) override { return true; } bool end_object() override { return true; } bool start_array(std::size_t elements) override { return true; } bool end_array() override { return true; } bool parse_error(std::size_t position, const std::string &last_token, const nlohmann::detail::exception &ex) override { throw ex; } }; int main() { std::stringstream in(\"\\xd9\\xd9\\xf7\"); NullSAXParser parser; nlohmann::json::sax_parse(in, &parser, nlohmann::json::input_format_t::cbor); } ``` The value I'm parsing (`0xd9d9f7`) is simply the optimal \"magic number\" tag for CBOR documents. From [the specification](https://tools.ietf.org/html/rfc7049#section-2.4.5): > The serialization of this tag is 0xd9d9f7, which appears not to be in > use as a distinguishing mark for frequently used file types. In > particular, it is not a valid start of a Unicode text in any Unicode > encoding if followed by a valid CBOR data item. Byte 0xd9 should be fine because it is equal to `(6 << 5) | 25`, in other words it has a major type of 6 (a tag), and lower 5 bits of 25, which for a tag means the actual tag value follows in a `uint16`, so it should just skip the following 2 bytes. Some extra code needs to be added [here](https://github.com/nlohmann/json/blob/develop/include/nlohmann/detail/input/binary_reader.hpp#L610). It doesn't understand tags at all.",
