        "base_sha": "74bb7b2533af3f063d0794fe3962fb5226c27751",
        "query": "Enhance iterate_many to enable parsing of comma separated documents ### Feature request Currently, `iterate_many` is able to parse a json like `auto json = R\"([1,2,3] {\"1\":1,\"2\":3,\"4\":4} [1,2,3] )\"_padded;` However, it would be nice to be able to parse a json with documents separated by commas `auto json = R\"([1,2,3] , {\"1\":1,\"2\":3,\"4\":4} , [1,2,3] )\"_padded;` ### Possible implementation (only a small part) I have looked into the code base a little, and I think we are able to perform the logic in the function `document_stream::next_document()` and consume any trailing commas after processing a particular document. ### Challenges However, running `stage1` poses a problem. We are no longer able to quickly identify the position of the last JSON document in a given batch. This is because `find_next_document_index` identifies the boundary between 2 documents by searching for `][` `]{` `}[` `}{` patterns starting from the back of the batch. If we put a comma between these patterns, we can't distinguish whether they are comma separated documents or elements in an array. Hence, I'm not sure if such a feature is possible to implement. I am willing to write the implementations if we agreeable with this feature and we have a solution to the `stage1` problem",
