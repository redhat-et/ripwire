        "query": "Conversion to user type containing a std::vector not working with documented approach When performing an assignement from `json` to a user defined type, vectors inside this object get appended. I've included a working example of the bug at the end of this issue but this is a smaller summary: ``` C++ class A { public: std::vector<double> a; A(){a.push_back(0.0);} }; void from_json(const json& j, A& p){ j.at(\"a\").get_to(p.a); ////// FROM THE DOCUMENTATION - does not work } json j1, j2; A v1, v2; j1=v1; // j1[\"a\"] == [0.0] v2=j1.get<A>(); // Unsafe j2=v2; // j2[\"a\"] == [0.0, 0.0] ``` I have read a bit about the problems with doing `std::vector<int> v=j` and that the `get` method of `json` should be used, however these issues seem to also affect the `j.get_to(v)` method. This means that when following the documentation for converting user defined types very strange run-time behaviours arise with no compile time indication that anything may go wrong. This can be fixed by replacing the `from_json` function to: ```C++ void from_json(const json& j, A& p){ p.a = j.at(\"a\").get<std::vector<double>>(); } ``` Not pretty and a bit brittle but simple enough. ### Possible solutions Am I doing something silly here that is causing this? If I am not I see 3 options: 1. Update the documentation to suggest to users the explicit .get<type> method. 2. Add a compile time error/warning? 3. Change the behaviour of the `get_to` method... ### system - Windows 7 64bits - g++ 8.1.0 on MinGW-w64 # Small Compilable Example # ``` C++ #include <iostream> #include <vector> #include \"json.hpp\" using nlohmann::json; // Class A does not work class A { public: std::vector<double> a; std::string name() {return(\"A\");} A(); }; A::A(){ this->a.push_back(0.0); } void to_json(json& j, const A& p){ j = json{ {\"a\", p.a}, }; } void from_json(const json& j, A& p){ j.at(\"a\").get_to(p.a); ////// FROM THE DOCUMENTATION - does not work } // Class B works as expected class B { public: std::vector<double> b; std::string name() {return(\"B\");} B(); }; B::B(){ this->b.push_back(0.0); } void to_json(json& j, const B& p){ j = json{ {\"b\", p.b}, }; } void from_json(const json& j, B& p){ p.b=j.at(\"b\").get<std::vector<double>>(); ////// THE DIFFERENCE - works } template<class T> int test(){ json j1, j2; T v1, v2; j1=v1; // Safe v2=j1.get<T>(); // Unsafe j2=v2; // Safe std::cout << \"Testing class \" << v1.name() << std::endl; std::cout << j1 << std::endl; std::cout << j2 << std::endl; if (j1!=j2){ std::cerr << \"Error: Parameter conversion to JSON \" <<\" is not symmetrical\" << std::endl; std::cerr << \"In: \" << __PRETTY_FUNCTION__ << std::endl; return (1); }; return(0); } int main(){ test<A>(); // This test shows that the member vector .a == {0.0, 0.0} test<B>(); // This test shows that the member vector .b == {0.0} // as it should be return(0); } ``` ## Output ## ``` Testing class A {\"a\":[0.0]} {\"a\":[0.0,0.0]} Error: Parameter conversion to JSON is not symmetrical In: int test() [with T = A] Testing class B {\"b\":[0.0]} {\"b\":[0.0]} ```",
