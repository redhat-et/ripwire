        "query": "Why we do not have a std::string_view version for the key() of field (not key_raw_json_token)? Hi, I've been exploring simdjson's API, particularly focusing on iterating over JSON objects and accessing their keys. From my understanding and current experimentation, it appears there are several methods to access keys but with certain limitations: 1. `field::key()` returns a `simdjson::ondemand::raw_json_string`, which provides the raw key but not in a directly usable `std::string_view` format without further processing. 2. `field::unescaped_key()` does return an unescaped key as `std::string_view`, which is great but involves the overhead of unescaping. 3. We also have access to `key_raw_json_token`, which retains the quotes. Considering the efficiency and ease of use of `std::string_view` in C++ for string operations, I'm wondering why there isn't a method like `field::key_sv()` (or any similarly named method) that directly returns a `std::string_view` of the key, akin to `field::key()` but without the need to deal with raw_json_string or token specifics. This addition would streamline operations that can benefit from the lightweight and efficient nature of `std::string_view`, especially in scenarios where string manipulation or comparisons are frequent. Is there a technical or design rationale for this absence, or could this be considered for future implementation? Such a feature would significantly enhance usability for developers focusing on performance-critical applications.",
