        "query": "Rationale for is<T> when exceptions are disabled When exceptions are disabled, then the is<T> template will return `simdjson_return<bool>`. So we have to do something like... ```C++ bool v; error_code x; doc.is<uint64_t>().tie(v,x); ``` That seems like a lot of work just to get a bool? It seems much more useful to call directly `get<uint64_t>`.",
