      {
        "instance_id": "simdjson__simdjson-954",
        "lang": "cpp",
        "org": "simdjson",
        "repo": "simdjson",
        "number": 954,
        "base_sha": "c25928e44fb69f5a3b1d0bbbabf75742e15269ee",
        "query": "Make parser.load_many() return simdjson_result Right now, if there is a file not found or something, the load_many() error doesn't get reported until you actually attempt to iterate it. We should let the user handle it earlier if they want: ```c++ // Proposal (noexcept code) auto [docs, load_error] = parser.load_many(filename) if (load_error) { return load_error; } for (auto [doc, error] = docs) { if (error) { return error; } } ``` ```c++ // Current (noexcept code) document_stream docs = parser.load_many(filename); for (auto [doc, error] = docs) { if (error) { return error; } } ``` ### Goals The primary goal, really, is to keep all of our classes' error behavior consistent: we only give you an object if there was *no error up to that point.* Once you get that document_stream, you should be able to know everything is peachy now. More to my own concern, these are the sorts of inconsistencies that cause an API to start growing thorns. You add new functionality and suddenly you need two error APIs because your assumptions about errors don't hold everywhere. ### Breaking Change This will not be a breaking change for users with exceptions, period. But it will be a breaking change for noexcept users. We might be able to mitigate that by providing a deprecated conversion from `simdjson_result<document_stream>` to `document_stream` that mirrors the current behavior ...",
        "subject": "Make parser.load_many() return simdjson_result",
