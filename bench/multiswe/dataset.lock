        "query": "Better error for JSON Pointer \"overshooting\" the actual JSON structure. Hello, I post after a longer time \ud83d\udc4b\ud83c\udffb - but we still very intensively use SIMDJSON (thru cysimdjson). **Is your feature request related to a problem? Please describe.** ```json { \"document\": { \"key1\": 1, \"key2\": \"2\", \"key3\": \"3\", \"key4\": 40, \"key5\": \"50\" } } ``` The call `.at_pointer(\"/document/key4/sub\")` fails (correctly) but the reported error is `INVALID_JSON_POINTER` (Invalid JSON pointer syntax). The JSON Pointer syntax is correct (at least in my understanding) - in a different JSON document, the JSON pointer will be perfectly fine. When this error is reported to users, it is misleading what to fix. **Describe the solution you'd like** Return different error code for this situation such as `NO_SUCH_FIELD`, so that the problem has a structure that can be used for a correct problem reporting to users. **Describe alternatives you've considered** We consider to build a validator of JSON Pointer that will be applied before the JSON pointer is applied to the JSON. So that we can capture real syntax errors, report them to the user and this one will be reported as a \"missing field/incorrect JSON structure\" for a given JSON Pointer **Additional context** N/A **Are you willing to contribute code or documentation toward this new feature?** No, I don't write C++ well enough to contribute, sorry.",
