        "query": "json_pointer.contains() exception is incorrectly raised When using `contains()` with a `_json_pointer`, if the json _object_ being tested has an _array_ in the path, the `_json_pointer` is incorrectly being restricted to reference an _array_ by the contents of the _object_, instead of verifying that the `_json_pointer` is contained in the provided json _object_. The operation of `contains()` demonstrates the following bug: - `contains()` must validate if a `_json_pointer` exists in a json _object_. - `contains()` must not validate if a `_json_pointer` may not exist in a json _object_. - `contains()` must never raise an exception if a `_json_pointer` can not be supported by a json _object_. **To reproduce:** ``` json test = { { \"a\", \"Ok\" }, { \"b\", { \"bad\", \"exception\", \"case\" } } }; cout << \"/a: \" << test.contains(\"/a\"_json_pointer) << endl; cout << \"/b/0: \" << test.contains(\"/b/0\"_json_pointer) << endl; cout << \"/b/x: \" << test.contains(\"/b/x\"_json_pointer) << endl; ``` **Current Behavior:** ``` /a: 1 /b/0: 1 /b/x: **(exception)** ``` **Expected Behavior:** ``` /a: 1 /b/0: 1 /b/x: 0 ``` Compiler: MSVC 2017, GCC This bug is present in v3.7.3 / master. Originally submitted as a question, but there has been no discussion for a month: #1942 I believe that RFC 6901 confirms this to be a bug - in that for the `contains()` operation, the `_json_pointer` is NOT being EVALUATED at each depth in the path, but the path existence is being tested at each depth. The operation performed is to verify if the pointer is CONTAINED in the object under test. Therefore, `contains()` pointer path processing should simply stop in this case, and no exception is to be raised. --- **Background: RFC 6901 on _json_pointer** Section 4: > Implementations will evaluate each reference token against the document's contents and will raise an error condition if it fails to resolve a concrete value for any of the JSON pointer's reference tokens. > For example, if an array is referenced with a non-numeric token, an error condition will be raised. See Section 7 for details. Section 7: > In the event of an error condition, evaluation of the JSON Pointer fails to complete. > Error conditions include, but are not limited to: > o Invalid pointer syntax > o A pointer that references a nonexistent value > This specification does not define how errors are handled. An application of JSON Pointer SHOULD specify the impact and handling of each type of error. > For example, some applications might stop pointer processing upon an error, while others may attempt to recover from missing values by inserting default ones.",
