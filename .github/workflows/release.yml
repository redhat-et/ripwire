name: Release

# Builds ripwire for macOS arm64/x64 + Linux x64/arm64 on every `vX.Y.Z` tag push and attaches the four
# binaries to a GitHub Release. UNTESTED UNTIL THE FIRST REAL TAG PUSH:
# this file is statically valid (see test/portablebuildcheck.sh's sibling validation note and the workflow
# README pointer below) but has never actually run — GitHub Actions itself cannot be executed from this
# dev environment. Review the FIRST run's logs closely before trusting `scripts/install.sh` against it.
#
# Every leg configures WITHOUT -DRIPWIRE_NATIVE=ON on purpose: a release binary must run on any machine of
# its target arch, not just the exact CPU that happened to build it (see cmake/PortableFlags.cmake — the
# portable default auto-applies safe generic Apple Silicon tuning on the two macOS-arm64 builders and
# emits zero host-specific flags everywhere else).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)build and release (workflow_dispatch testing only)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14 # Apple Silicon (arm64) hosted runner
            asset_arch: arm64
            asset_os: macos
            pgo: true
          - name: macos-x64
            os: macos-14 # cross-compiled: the macos-13 Intel runner pool is retired — the v0.1.0 and
                         # first v0.2.0 runs both left its leg queued until the 24h auto-cancel. Built
                         # as x86_64 on the arm64 runner; the smoke-test still executes for real via
                         # Rosetta 2 (installed on GitHub's macos-14 images).
            asset_arch: x64
            asset_os: macos
            pgo: true # trains under Rosetta 2 — instrumentation counts edges of the same code, so the
                      # profile is valid x86_64 data; it is just slower to collect
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - name: linux-x64
            os: ubuntu-24.04
            # AlmaLinux-8-based manylinux container (glibc 2.28) with Red Hat gcc-toolset: newer
            # libstdc++ symbols are linked statically (the devtoolset model), so ONE binary runs on
            # RHEL/Alma/Rocky 8+, CentOS Stream, Fedora, Ubuntu 20.04+, Debian 11+. Built on stock
            # ubuntu-24.04 instead, the binary needs GLIBCXX_3.4.31 and dies on RHEL 9 (verified).
            container: quay.io/pypa/manylinux_2_28_x86_64
            asset_arch: x64
            asset_os: linux
          - name: linux-arm64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            asset_arch: arm64
            asset_os: linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          # manylinux/EL containers use dnf (libxml2 ships xmllint); the bare Ubuntu runner used apt
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y libxml2
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi


      - name: Configure (portable — no RIPWIRE_NATIVE, this binary ships to other machines)
        if: ${{ !matrix.pgo }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra || '' }}

      - name: Build
        if: ${{ !matrix.pgo }}
        run: cmake --build build -j --target ripwire

      # PGO for the shipped binary (macOS legs only): scripts/pgobuild.sh is the same one-command
      # instrument -> train -> merge -> optimize flow a dev runs, trained on this checkout (the
      # script's own mixed workload). The Linux legs deliberately STAY LTO-only: their manylinux
      # gcc-toolset is load-bearing for the RHEL static-libstdc++ compat model, and CMake's PGO arm
      # refuses GCC (its -fprofile-* is the incompatible .gcda flavour) — moving Linux to clang is a
      # separate toolchain decision, not a rider on this step. Package/smoke read build/ripwire on
      # every leg, so the optimized binary is staged there — a plain file copy; what CMakeLists
      # refuses is CONFIGURING a PGO tree named build/, which this is not.
      - name: Build (profile-guided — instrument, train, merge, optimize)
        if: ${{ matrix.pgo }}
        run: |
          scripts/pgobuild.sh --cmake-extra -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra && format('--cmake-extra {0}', matrix.cmake_extra) || '' }}
          mkdir -p build
          cp build_pgo/ripwire build/ripwire

      # Determinism is a contract and PGO is an optimizer change — the exact class the contract
      # guards against. Two runs must be byte-identical before this binary may ship.
      - name: PGO determinism check
        if: ${{ matrix.pgo }}
        run: |
          ./build/ripwire test/fixture --no-cache > a.xml
          ./build/ripwire test/fixture --no-cache > b.xml
          diff a.xml b.xml

      - name: Smoke-test the freshly built binary
        run: |
          ./build/ripwire --version
          ./build/ripwire test/fixture --no-cache | xmllint --noout -

      - name: Package
        id: package
        run: |
          version="$( ./build/ripwire --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 )"
          asset="ripwire-${version}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
          mkdir -p "dist/${asset}"
          cp build/ripwire "dist/${asset}/ripwire"
          cp README.md LICENSE "dist/${asset}/" 2>/dev/null || cp README.md "dist/${asset}/"
          # skills/ is the payload that teaches an agent WHEN to reach for ripwire (17 ripwire-*/ dirs +
          # skills/install.sh, which symlinks from its OWN location — so it must travel with the tarball,
          # not just live in the repo checkout). scripts/install.sh stages this subtree straight into
          # $prefix/share/ripwire/skills; asset names and the top-level ripwire/README.md/LICENSE layout
          # are unchanged, this is purely additive.
          # no trailing slash on the glob: BSD cp (macOS runners) with a trailing slash copies each
          # source dir's CONTENTS into the destination (flattening/overwriting same-named files like
          # SKILL.md across skills) instead of copying the directory itself — verified live on this repo.
          mkdir -p "dist/${asset}/skills"
          cp -R skills/ripwire-* "dist/${asset}/skills/"
          cp skills/install.sh "dist/${asset}/skills/"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          # basename inside the checksum file — `shasum -a 256 "dist/..."` bakes the dist/ prefix into
          # the published .sha256, which breaks `shasum -c` beside the downloaded pair (and therefore
          # scripts/install.sh's verification step, which checks exactly that way). sha256sum fallback:
          # the manylinux containers ship coreutils but not perl's shasum; both emit "HASH  NAME".
          if command -v shasum >/dev/null 2>&1; then
            ( cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256" )
          else
            ( cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256" )
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/${{ steps.package.outputs.asset }}.tar.gz
            dist/${{ steps.package.outputs.asset }}.tar.gz.sha256
          if-no-files-found: error

  smoke-rhel:
    name: smoke RHEL 9 (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # ubi9 = RHEL 9 userland (glibc 2.34, libstdc++ GLIBCXX <= 3.4.29): exactly the environment the
    # pre-manylinux binaries died on. The packaged tarball must run here or publish is blocked.
    container: registry.access.redhat.com/ubi9/ubi
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: dnf install -y libxml2

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.name }}"
          path: dist
          merge-multiple: true

      - name: Run the packaged binary on RHEL 9
        run: |
          tar -xzf dist/*.tar.gz -C dist
          bin="$( find dist -type f -name ripwire )"
          "$bin" --version
          "$bin" test/fixture --no-cache | xmllint --noout -

  publish:
    name: publish GitHub Release
    needs: [build, smoke-rhel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged release assets
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
