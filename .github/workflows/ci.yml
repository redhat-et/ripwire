# TEMP (lane mem-largealloc): a small Linux measuring step; the next commit restores the real ci.yml.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build
          cmake --build build -j4 --target ripwire
          ./build/ripwire --version
      - name: Measure
        run: |
          python3 tools-tmp-largealloc/genfx.py /tmp/fx 3000 400
          (cd /tmp/fx && git init -q . )
          nproc; free -m
          python3 tools-tmp-largealloc/measure.py "$PWD/build/ripwire" /tmp/fx
